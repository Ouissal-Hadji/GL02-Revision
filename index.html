<template id="t-ex">
<h2>1. Use case diagram (DCU): Library TD</h2>
<div class="tag">Mermaid draws it as a flowchart. On paper use stick figures and ellipses. Arrow rule: include → toward the included case; extend → toward the base case; “is a” = hollow triangle.</div>
<pre class="mermaid">flowchart LR
Lib((Librarian)) --- AddS([Add student])
Lib --- Rem([Remove student])
Lib --- Card([Print library card])
Lib --- AddB([Add book])
Lib --- Rent([Rent book])
Lib --- Ret([Return book])
AddS -.->|include| Ver([Verify registration])
Card -.->|extend| AddS
Search([Search book]) -.->|extend| AddB
Rent -.->|include| Search
Ret -.->|include| Search
SA([By author]) -->|is a| Search
ST([By title]) -->|is a| Search
SP([By publisher]) -->|is a| Search
Stu((Student)) --- Search
Reg((Registered student)) -->|is a| Stu
Reg --- Hist([View history])</pre>
<h2>2. Class diagram (DCL): AutoChauffeur TD</h2>
<pre class="mermaid">classDiagram
class ParentCompany{+name}
class Agency{+name +city}
class Vehicle{<<abstract>> +licensePlate +brand +model +baseDailyRate}
class Car{+numberOfSeats +category}
class Truck{+tonnageCapacity +volumeM3}
class Driver{+badgeCode +lastName +firstName +licenseNumber}
class Customer{+clientId +name +phone +email}
class RentalContract{+startDate +endDate +totalPrice}
ParentCompany "1" *-- "1..*" Agency : composed of
Agency "1" o-- "0..*" Vehicle : manages
Agency "1" *-- "0..*" Driver : employs
Vehicle <|-- Car
Vehicle <|-- Truck
Driver "1" --> "0..*" Vehicle : drives
Customer "1" --> "0..*" RentalContract : makes
RentalContract "0..*" --> "1" Vehicle : concerns</pre>
<h3>Java (rule: 1 → field, * → List, inheritance → extends)</h3>
<div class="card scroll"><pre>public abstract class Vehicle {
  protected String licensePlate, brand, model;
  protected double baseDailyRate;
  protected Agency agency;                   // 1
  protected Driver driver;                   // 1
  protected List&lt;RentalContract&gt; contracts;  // 0..*
}
public class Car extends Vehicle {
  private int numberOfSeats; private String category;
}
public class Truck extends Vehicle {
  private double tonnageCapacity, volumeM3;
}
public class Agency {
  private String name, city;
  private ParentCompany company;             // 1
  private List&lt;Vehicle&gt; vehicles;            // 0..* aggregation
  private List&lt;Driver&gt; drivers;              // 0..* composition
}</pre></div>
<h3>Relational model (MLD): PK = underlined here as _x_, FK = *</h3>
<div class="card scroll"><pre>Company  (_id_C_, name)
Agency   (_id_A_, name, city, id_C*)
Driver   (_badgeCode_, lastName, firstName, licenseNumber, id_A*)
Vehicle  (_licensePlate_, brand, model, baseDailyRate, id_A*, badgeCode*)
Car      (_id_Ca_, numSeat, category, licensePlate*)
Truck    (_id_T_, capacity, volume, licensePlate*)
Client   (_id_cl_, name, phone, email)
Contract (_id_contract_, startDate, endDate, totalPrice, id_cl*, licensePlate*)</pre></div>
<div class="tag">Rules: class → table · 1—* → FK on the * side · *—* or association class → new table · inheritance → child table with FK to parent.</div>

<template id="t-fs">
<h2>From a use case sheet to a system sequence diagram (2025/26 exam: “S’inscrire”)</h2>
<table><tr><th>Sheet part</th><th>Becomes</th></tr>
<tr><td>Nominal scenario 1–6</td><td>Plain messages Visitor ↔ System, in order</td></tr>
<tr><td>A1: missing or wrong info, back to step 2</td><td><b>loop</b> [incorrect info] around form + verify</td></tr>
<tr><td>A2 buyer / A3 seller</td><td><b>alt</b> [type = buyer] / [type = seller] (seller: ask docs, save, notify admin)</td></tr>
<tr><td>E1: visitor does not answer, system cancels</td><td><b>break</b> or opt with a cancel message</td></tr>
<tr><td>Other use case reused (manage accounts)</td><td><b>ref</b> frame</td></tr></table>
<pre class="mermaid">sequenceDiagram
actor V as Visitor
participant S as System
actor A as Admin
V->>S: 1 requestRegistration()
loop while info incorrect
S-->>V: 2 form
V->>S: 3 fillForm()
S->>S: 4 verifyForm()
end
S-->>V: 5 askAccountType()
V->>S: 6 type
alt type = seller
S-->>V: 7 askDocuments()
V->>S: 8 documents
S->>S: 9 saveAccount()
S->>A: 10 notify(verification)
else type = buyer
S->>S: 11 saveAccount()
S-->>V: 12 displayHome()
end</pre>
<div class="tag">Method: 1) one sentence = one message 2) add dashed returns 3) wrap repetition in loop, if/else in alt, abort in break 4) number everything 5) frame with sd.</div>
</template>

<template id="t-pr">
<h2>Practice: fresh exam-style exercise (20 pts)</h2>
<div class="card"><b>Bike sharing app.</b> A customer registers, then can search stations by city. To rent a bike he must be authenticated and the system checks availability; he can optionally enter a promo code. When he returns the bike the system computes the price and charges his card automatically. A rental has a start and end time. A station has a name, city and capacity and holds many bikes. A bike is either Electric (battery level) or Classic (number of gears). The admin adds bikes and can block a customer.
<br><b>Q1</b> Use case diagram (7) · <b>Q2</b> Domain class diagram with attributes (7) · <b>Q3</b> Detailed or system sequence diagram of “Rent a bike” with an alternative and an exception (6).
<br><i>Draw on paper first (15 min), then open the model answer.</i></div>
<details><summary>Model answer</summary>
<pre class="mermaid">flowchart LR
Cu((Customer)) --- Reg([Register])
Cu --- Se([Search stations])
Cu --- Rt([Rent bike])
Cu --- Rb([Return bike])
Rt -.->|include| Au([Authenticate])
Rt -.->|include| Av([Check availability])
Pr([Enter promo code]) -.->|extend| Rt
Rb -.->|include| Pay([Pay by card])
Ad((Admin)) --- Ab([Add bike])
Ad --- Bl([Block customer])</pre>
<pre class="mermaid">classDiagram
class Station{+name +city +capacity}
class Bike{<<abstract>> +id}
class Electric{+batteryLevel}
class Classic{+gears}
class Customer{+name +email}
class Rental{+startTime +endTime +price}
Station "1" o-- "0..*" Bike : holds
Bike <|-- Electric
Bike <|-- Classic
Customer "1" --> "0..*" Rental : makes
Rental "0..*" --> "1" Bike : concerns</pre>
<pre class="mermaid">sequenceDiagram
actor C as Customer
participant S as System
C->>S: 1 rentBike(bikeId)
S->>S: 2 checkAvailability()
alt bike available
opt promo code
C->>S: 3 enterPromo(code)
end
S-->>C: 4 rentalConfirmed
else not available
S-->>C: 5 unavailableMessage
end
break user cancels
C->>S: 6 cancel()
end</pre></details>

const FC=[
["The 5 characteristics of UP","UML · use-case driven · iterative & incremental · architecture-centred · risk-driven\nخمس خصائص"],
["UP primary elements: who / what / how / when","Roles / Artifacts / Activities / Workflow"],
["Milestone at the end of Inception, Elaboration, Construction, Transition","Vision · Architecture · Beta version · Version 1"],
["Which phase makes the use case diagram? The class diagram? The deployment diagram?","Inception · Elaboration · Construction"],
["When do we plan use cases, and why?","Before their textual and graphical description. Iterations get use cases by priority, riskiest first (iterative + risk-driven)."],
["Tests in Construction vs Transition","Construction: no users. Transition: real users, beta tests."],
["Why is the use case model both input and output of analysis?","The output is the refinement of the input."],
["Roles of each activity","Requirements: analysts · Analysis: analysts · Design: designers/architects · Implementation: developers/integrators · Test: testers"],
["A use case is described by…","Descriptive sheet, system sequence diagram, activity diagram"],
["include or extend? “must / before / obligatory”","include (mandatory). Arrow from the base to the included case.\nإلزامي"],
["include or extend? “can / if he wishes / optional”","extend. Arrow from the optional case to the base.\nاختياري"],
["When do you use generalization in a DCU?","“Types of”: search by author/title, registered student is a student.\nأنواع"],
["Aggregation vs composition test","Delete the whole: parts die → composition (filled diamond), survive → aggregation (hollow).\nتركيب / تجميع"],
["How do you read multiplicity?","The number at class B answers: how many B for one A?"],
["Association → relational model","1—* : FK on the * side. *—* or association class: new table with 2 FKs. Inheritance: child table with FK to parent."],
["Sequence fragments","loop = repeat · alt = if/else · opt = if · break = abort · ref = see other diagram"],
["System sequence diagram vs detailed","System: actor + one black-box system. Detailed: boundary, control, entity objects, «create»."],
["Jacobson stereotypes","boundary (presentation) · control (processing) · entity (data)"],
["Define: development process / architecture / actor / glossary","Process: who does what, when, how; a sequence of steps giving a quality system on predictable time and cost.\nArchitecture: skeleton of the system, its main elements and their relations.\nActor: role of an entity external to the system.\nGlossary: key business terms; resolves synonyms and homonyms."],
["Test levels","Unit · integration · acceptance (réception) · performance · non-regression"],
["A good architecture is…","Supports use cases · adaptable to change · favours reuse · easy to understand.\nInfluenced by: languages/frameworks, platform, reusable components, deployment and non-functional constraints."],
["Why is modelling important?","Clarifies requirements · eases communication · reduces errors · structures development · improves maintainability"],
["The 3 UML axes","Functional: use case · Structural: class, object, component, deployment · Dynamic: sequence, collaboration, activity, state"],
["UML vs UP","UML = graphical language, no order of use. UP = process that says which diagram, when, by whom.\nUML لغة رسم، UP طريقة عمل"],
["Objectives of UP","Quality software within time, cost, performance · efficient development, fewer risks · best practices"],
["Advantages of iterative development","Risk and complexity management · fast feedback · flexibility · continuous integration and quality · stakeholder engagement · faster, cheaper"],
["Inception: goal, activities, deliverable","Feasibility, risks, functional and non-functional needs, estimation, main use cases.\nDeliverable: cahier des charges. Milestone: Vision."],
["Elaboration: goal, deliverable","Detailed analysis of the technical domain, stable reference architecture, quality levels, detailed planning.\nDeliverable: executable architecture."],
["Construction: goal, deliverable","Design, implementation, tests; builds all planned use cases.\nDeliverable: beta version (may still have defects)."],
["Transition: goal, deliverable","Delivery to real users, beta tests, user training and manuals, support.\nDeliverable: Version 1."],
["The two axes of UP (Figure 2)","Horizontal = time, dynamic: phases and iterations. Vertical = static: activities, workflows, artifacts, roles."],
["Iteration vs phase vs cycle vs milestone","Iteration: mini-project inside a phase. Phase: 4 per cycle. Cycle: the 4 phases, gives a version. Milestone: validates the end of a phase or iteration."],
["Figure 1: the use case model is…","specified by analysis, realized by design, distributed by deployment, implemented by implementation, verified by test"],
["Why is UP use-case driven?","Validates needs with users · all models derive from it · used through the whole cycle"],
